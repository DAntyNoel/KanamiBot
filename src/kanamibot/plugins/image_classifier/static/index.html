<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f6f5f1" />
    <title>Image Lab · 图片分类工作台</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Crect width='40' height='40' rx='12' fill='%23ec6845'/%3E%3Cpath d='M10 25l7-10 5 7 4-5 5 8' fill='none' stroke='white' stroke-width='3'/%3E%3C/svg%3E"
    />
    <link rel="stylesheet" href="/static/style.css" />
    <script src="/static/app.js" defer></script>
  </head>
  <body>
    <div class="page">
      <header class="topbar">
        <a class="brand" href="/" aria-label="Image Lab 首页">
          <span class="brand-icon" aria-hidden="true"
            ><svg viewBox="0 0 24 24">
              <path d="m4 17 6-9 5 7 3-4 3 6M18 5h.01" /></svg
          ></span>
          <span
            >kanami<span class="brand-separator">/</span
            ><strong>Image Lab</strong></span
          >
        </a>
        <div class="runtime">
          <span class="runtime-dot" id="status-dot"></span
          ><span id="model-status" role="status">连接中</span
        </div>
      </header>

      <main class="workspace">
        <aside class="sidebar">
          <section class="upload-panel panel">
            <label
              class="dropzone"
              id="dropzone"
              tabindex="0"
              role="button"
              aria-label="选择图片或拖放图片到这里"
            >
              <input
                type="file"
                id="file-input"
                accept="image/*,.avif,.heic,.heif"
                multiple
                hidden
              />
              <span class="upload-icon" aria-hidden="true"
                ><svg viewBox="0 0 32 32">
                  <path d="M16 22V7m-6 6 6-6 6 6M7 22v5h18v-5" /></svg
              ></span>
              <strong>添加图片</strong>
            </label>
            <p id="upload-error" class="inline-error" role="alert" hidden></p>
          </section>

          <section class="model-panel panel">
            <div class="section-label">
              <h2>模型</h2>
            </div>
            <div class="model-item">
              <div>
                <h3>二次元细分类</h3>
                <div class="model-lifecycle">
                  <button type="button" data-model-action="anime" disabled>
                    卸载
                  </button>
                </div>
              </div>
              <label class="model-toggle"
                ><input
                  type="checkbox"
                  data-model="anime"
                  checked
                  aria-label="启用 real-or-anime-age" /><span
                  class="toggle-track"
                ></span
              ></label>
            </div>
            <div class="model-item">
              <div>
                <h3>二次元 / 三次元</h3>
                <div class="model-lifecycle">
                  <button type="button" data-model-action="anime_real" disabled>
                    卸载
                  </button>
                </div>
              </div>
              <label class="model-toggle"
                ><input
                  type="checkbox"
                  data-model="anime_real"
                  checked
                  aria-label="启用 anime_real_cls" /><span
                  class="toggle-track"
                ></span
              ></label>
            </div>
            <div class="model-item">
              <div>
                <h3>NSFW</h3>
                <div class="model-lifecycle">
                  <button type="button" data-model-action="nsfw" disabled>
                    卸载
                  </button>
                </div>
              </div>
              <label class="model-toggle"
                ><input
                  type="checkbox"
                  data-model="nsfw"
                  checked
                  aria-label="启用 nsfw_image_detection" /><span
                  class="toggle-track"
                ></span
              ></label>
            </div>
            <p
              id="model-feedback"
              class="model-feedback"
              role="status"
              hidden
            ></p>
          </section>
        </aside>

        <section class="results-section" aria-labelledby="results-title">
          <div class="results-toolbar">
            <div class="section-label">
              <h2 id="results-title">结果</h2>
              <span class="count" id="result-count">0</span>
            </div>
            <div class="toolbar-actions">
              <button id="export-button" class="text-button" disabled>
                导出 <span aria-hidden="true">↗</span></button
              ><button id="clear-button" class="text-button muted" disabled>
                清空
              </button>
            </div>
          </div>
          <nav
            id="thumbnail-nav"
            class="thumbnail-nav panel"
            aria-label="按图片快速跳转分析结果"
            hidden
          ></nav>
          <div
            class="queue-status"
            id="queue-status"
            role="status"
            hidden
          ></div>
          <div class="empty-state" id="empty-state" aria-label="暂无图片">
            <div class="empty-graphic" aria-hidden="true">
              <div class="graphic-card back-card">
                <span></span><span></span><span></span>
              </div>
              <div class="graphic-card front-card">
                <svg viewBox="0 0 60 52">
                  <circle cx="40" cy="15" r="5" />
                  <path d="m8 43 15-23 13 18 7-10 10 15" />
                </svg>
                <div><i></i><i></i><i></i></div>
              </div>
              <span class="graphic-spark">✧</span>
            </div>
          </div>
          <div
            id="results"
            class="results-list"
            aria-live="polite"
            aria-relevant="additions"
          ></div>
        </section>
      </main>
    </div>

    <template id="result-template">
      <article class="result-card panel">
        <header class="card-header">
          <span class="file-number"></span>
          <h3 class="file-name"></h3>
          <span class="card-state">排队中</span>
        </header>
        <div class="card-body">
          <div class="image-column">
            <div class="image-preview"><img alt="上传图片预览" /></div>
            <div class="image-meta"></div>
            <div class="prediction-badges"></div>
          </div>
          <div class="scores-column">
            <div class="card-placeholder">
              <span class="spinner"></span>
              <p></p>
            </div>
            <div class="score-content" hidden>
              <div class="dimension-summary">
                <div>
                  <span>二次元</span><strong class="anime-probability"></strong>
                </div>
                <div>
                  <span>非二次元</span
                  ><strong class="real-probability"></strong>
                </div>
              </div>
              <div class="dimension-bar"><span></span></div>
              <section class="score-group anime-group">
                <div class="score-heading">
                  <h4>二次元细分类</h4>
                </div>
                <div class="anime-rows"></div>
              </section>
              <section class="score-group anime-real-group">
                <div class="score-heading">
                  <h4>二次元 / 三次元</h4>
                </div>
                <div class="anime-real-rows"></div>
              </section>
              <section class="score-group nsfw-group">
                <div class="score-heading">
                  <h4>NSFW</h4>
                </div>
                <div class="nsfw-rows"></div>
              </section>
              <div class="result-detail"></div>
            </div>
          </div>
        </div>
      </article>
    </template>
  </body>
</html>
