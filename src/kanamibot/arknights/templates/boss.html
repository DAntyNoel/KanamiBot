<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>{{ title }}</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; background: #1b2024; color: #fff;
      font-family: "HarmonyOS Sans SC", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; }
    #template { width: 1280px; padding: 30px; min-height: 720px;
      background: linear-gradient(135deg, #38434a, #11171b); }
    .header { padding: 12px 0 24px; border-bottom: 3px solid #bd1920; }
    h1 { margin: 0; font-size: 38px; line-height: 1.3; text-shadow: 0 2px 5px #000; }
    .hint { margin-top: 12px; color: #e3e9ec; font-size: 21px; }
    .grid { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr));
      gap: 22px; margin-top: 28px; }
    .boss { position: relative; overflow: hidden; background: #24292f;
      border: 2px solid #b8413c; }
    .portrait { height: 195px; padding: 12px;
      background: radial-gradient(circle, #5b6269 0%, #23282e 72%); }
    .portrait img { width: 100%; height: 100%; object-fit: contain; }
    .index { position: absolute; top: 0; left: 0; min-width: 45px; padding: 6px 10px;
      background: #b8413c; font-size: 24px; font-weight: 900; text-align: center; }
    .name { min-height: 105px; border-top: 4px solid #b8413c; padding: 13px 14px;
      font-size: 25px; font-weight: 700; line-height: 1.4; overflow-wrap: anywhere; }
    .section-title { display: inline-block; margin: 25px 0 12px; padding: 4px 42px 4px 12px;
      color: #111; background: #fff; font-size: 24px; font-weight: 800; }
    .wiki { padding: 16px; background: rgb(19 25 29 / 80%); border-radius: 8px;
      font-size: 20px; line-height: 1.6; overflow-wrap: anywhere; }
    .wiki table { width: 100% !important; max-width: 100% !important; margin: 12px 0;
      border-collapse: collapse; background: transparent !important; color: #fff !important;
      white-space: normal !important; font-size: inherit !important; }
    .wiki td, .wiki th { border: 1px solid #6e7980; padding: 8px 12px;
      background-color: #20292f !important; }
    .wiki th { background-color: #39464f !important; }
    .wiki p { margin: 6px 0; }
    .wiki h2 { font-size: 25px; color: #ff9a60; margin: 18px 0 10px; }
    .wiki a { color: #a8dbed; text-decoration: none; }
    .wiki img { max-width: 160px; max-height: 160px; object-fit: contain; vertical-align: middle; }
    .wiki .enemy-rank-icon img { width: 20px; height: 21px; filter: invert(1); }
    .wiki .enemyicon { display: inline-block; position: relative; }
    .wiki .enemyicon-index { display: none; }
    .wiki .statusRankText, .wiki .enemy-info-level-side-tag { display: none; }
  </style>
</head>
<body>
<main id="template">
  <header class="header">
    <h1>{{ title }}</h1>
    {% if entries %}<div class="hint">#卫 boss 序号　／　#卫 boss 序号 隐秘</div>{% endif %}
  </header>
  {% if entries %}
  <section class="grid">
    {% for boss in entries %}
    <article class="boss">
      <div class="portrait"><img src="{{ boss.icon }}" alt="{{ boss.name }}"></div>
      <div class="index">{{ boss.index }}</div>
      <div class="name">{{ boss.name }}</div>
    </article>
    {% endfor %}
  </section>
  {% endif %}
  {% for section in sections %}
  <div class="section-title">{{ section.title }}</div>
  <section class="wiki">{{ section.html | safe }}</section>
  {% endfor %}
</main>
</body>
</html>
