[project]
name = "kanamibot"
version = "0.1.0"
description = "A lightweight NoneBot2 skeleton for NapCat / OneBot v11."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "beautifulsoup4>=4.12,<5",
    "bilibili-api-python>=17.4.1,<18",
    "fastapi>=0.115,<1",
    "httpx>=0.27.0",
    "jinja2>=3.1.4",
    "imageio[ffmpeg]>=2.37.2",
    "jieba>=0.42.1",
    "meme-generator>=0.2.3,<0.3",
    "nonebot2[fastapi,httpx,websockets]>=2.5.0",
    "nonebot-adapter-onebot>=2.4.6",
    "nonebot-plugin-apscheduler>=0.5.0",
    "numpy>=1.26,<3",
    "onnxruntime>=1.20,<2",
    "tzdata>=2025.2",
    "uvicorn>=0.30,<1",
    "pillow>=12.0.0",
    "playwright>=1.45.0",
    "pydub>=0.25.1",
    "qrcode>=8.2",
    "python-dotenv>=1.0.1",
    "rapidfuzz>=3.14.3",
    "rsilk>=0.1.4",
    "wordcloud>=1.9.4",
    "erbs-plugin[render]>=0.1.0,<0.2.0",
    "nonebot-plugin-skland",
    "nonebot-plugin-orm[sqlite]>=0.8.4",
]

[project.scripts]
kanami-image-web = "kanamibot.plugins.image_classifier.web:main"

[dependency-groups]
image-model-export = [
    "torch>=2.6,<3",
    "transformers>=4.46,<5",
    "onnx>=1.17,<2",
    "huggingface-hub>=0.26,<1",
]
dev = [
    "pytest>=8.2.0",
    "ruff>=0.11.0",
]

[tool.uv]
package = true

[tool.uv.sources]
erbs-plugin = { path = "src/kanamibot/plugins/ERBS-plugin", editable = true }
nonebot-plugin-skland = { path = "src/kanamibot/plugins/skland/_upstream", editable = true }

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [".uv-cache", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
